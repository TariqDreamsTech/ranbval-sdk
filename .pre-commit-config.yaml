# Pre-commit for ranbval-sdk.
#
# Two stages, split by how long each check takes — a commit hook that takes ten seconds gets
# bypassed with --no-verify, which is the outcome this whole project exists to avoid:
#
#   pre-commit  fast checks on the staged files (formatting, lint, leaked-secret scan)
#   pre-push    the whole suite, type checking, and a real package build
#
# Install both stages (the second is NOT installed by `pre-commit install` alone):
#
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Run everything against the whole tree once, without committing:
#
#   pre-commit run --all-files --hook-stage pre-push

default_install_hook_types: [pre-commit, pre-push]
default_language_version:
  python: python3

repos:
  # ── Hygiene ────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: debug-statements

      # A committed private key in a secret manager's own repository would be the
      # most quotable failure available, so it is checked on every commit.
      - id: detect-private-key

  # ── Lint and format ────────────────────────────────────────────────────────
  # Configured in pyproject.toml ([tool.ruff]) so the hook and a local run agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Leaked credentials ─────────────────────────────────────────────────────
  # Scans the diff, not just the working tree, so a secret committed earlier in a
  # branch is caught before it is pushed. Runs at both stages: catching it at commit
  # is better, catching it at push is the last point before it leaves the machine.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  # ── Python security lint ───────────────────────────────────────────────────
  # Source only. Tests deliberately construct weak/fake secrets and exercise unsafe
  # paths, so scanning them produces findings that are the point of the test.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q, -ll]  # gate on medium+; see [tool.bandit] for why
        additional_dependencies: ["bandit[toml]"]
        files: ^src/
        exclude: ^tests/

  # ── Ranbval's own linter ───────────────────────────────────────────────────
  # Dogfooding: unclassified keys, competing .env files, and a world-readable
  # root-key file all fail here. If our own gate is not good enough for our own
  # repository, it is not good enough to ship.
  - repo: local
    hooks:
      - id: ranbval-check
        name: ranbval check (config classification + file modes)
        entry: python3 -m ranbval_sdk.cli check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ── Types and tests: pre-push only ─────────────────────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict-ish, src only)
        entry: python3 -m mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: pytest (full suite)
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The version in pyproject.toml must have a CHANGELOG entry. This is the same
      # gate CI applies; failing here means finding out in seconds rather than after
      # a push, a CI queue, and a red build.
      - id: changelog-entry
        name: version has a CHANGELOG entry
        entry: python3 scripts/check_changelog.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The built artifact is what users install; `twine check` catches metadata
      # that renders broken on PyPI, which cannot be fixed after upload.
      - id: build-and-check
        name: build sdist+wheel and twine check
        entry: python3 scripts/build_check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
